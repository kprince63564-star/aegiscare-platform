# ==============================================================================
# Google Cloud Build Pipeline for AegisCare Elderly Care Platform
# Builds container and deploys seamlessly to Google Cloud Run
# ==============================================================================
steps:
  # Step 1: Build the container image using Cloud Build Cache
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aegiscare-platform:$COMMIT_SHA', '.']

  # Step 2: Push the container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aegiscare-platform:$COMMIT_SHA']

  # Step 3: Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aegiscare-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aegiscare-platform:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/aegiscare-platform:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
